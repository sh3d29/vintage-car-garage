[project]
name = "server"
version = "0.1.0"
description = ""
authors = [
    {name = "Sebastian Hardt",email = "sebastian.hardt@mni.thm.de"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard] (>=0.136.3,<0.137.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "poethepoet (>=0.46.0,<0.47.0)"
]

[tool.poe.tasks]
dev = "fastapi dev"
format = "ruff format ."
lint = "ruff check ."